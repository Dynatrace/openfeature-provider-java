name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release-please:
        permissions:
            contents: write
            pull-requests: write
            actions: write
        runs-on: ubuntu-latest

        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            # GITHUB_TOKEN pushes don't trigger CI (except workflow_dispatch), so start it for the release PR
            - name: Run CI on release PR
              if: ${{ steps.release.outputs.prs_created == 'true' }}
              run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

        outputs:
            release_created: ${{ steps.release.outputs.release_created }}

    publish:
        runs-on: ubuntu-latest
        needs: release-please
        environment: publish
        permissions:
            contents: read
        if: ${{ fromJSON(needs.release-please.outputs.release_created || false) }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Set up JDK 17
              uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: maven

            - name: Configure GPG Key
              run: |
                  echo -n "$GPG_SIGNING_KEY" | base64 --decode | gpg --import
              env:
                  GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}

            - name: Deploy to Maven Central
              run: |
                  mvn --batch-mode \
                    --settings release/m2-settings.xml \
                    -DskipTests clean deploy
              env:
                  CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
                  CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
