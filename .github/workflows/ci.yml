name: CI

on:
    pull_request:
        branches:
            - main
    merge_group:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up JDK 17
              uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: maven

            - name: Verify
              run: mvn --batch-mode verify

    e2e:
        name: E2E Tests
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up JDK 17
              uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: maven

            - name: Run E2E tests
              run: mvn --batch-mode test -Pe2e

    # single required check for branch protection; keeps job/matrix renames out of the registry
    ci-passed:
        name: CI Passed
        if: always()
        needs: [build, e2e]
        runs-on: ubuntu-latest
        steps:
            - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
              run: exit 1
