name: CI

on:
    pull_request:
        branches:
            - main
    merge_group:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

            - name: Set up JDK 17
              uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: maven

            - name: Verify
              run: mvn --batch-mode verify

    e2e:
        name: E2E Tests
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

            - name: Set up JDK 17
              uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: maven

            - name: Run E2E tests
              run: mvn --batch-mode test -Pe2e
